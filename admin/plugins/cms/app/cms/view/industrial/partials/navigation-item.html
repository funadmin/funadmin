{cms:if test="$nav.has_children"}
<el-sub-menu index="{$nav.id}" popper-class="cms-el-menu-popup" show-timeout="80" hide-timeout="120">
  <span data-cms-slot="title">{$nav.title}</span>
  <el-menu-item index="overview-{$nav.id}"><a class="cms-menu-link" href="{$nav.url}" {cms:if test="$nav.open_in_new_tab"}target="_blank" rel="noopener noreferrer"{/cms:if}>{$nav.overview_title}</a></el-menu-item>
  {$nav.children}
</el-sub-menu>
{cms:else /}
<el-menu-item index="{$nav.id}"><a class="cms-menu-link" href="{$nav.url}" {cms:if test="$nav.open_in_new_tab"}target="_blank" rel="noopener noreferrer"{/cms:if}>{$nav.title}</a></el-menu-item>
{/cms:if}
