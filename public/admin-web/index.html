    <!-- Read persisted theme before the app mounts. -->
    <script>
      (function () {
        var KEY = 'ADMIN_THEME';
        var primary = '#2c7be5';
        var themeMode = 'light';
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var d = JSON.parse(raw);
            if (d && typeof d.primaryColor === 'string') {
              var c = d.primaryColor.trim();
              if (/^#[0-9A-Fa-f]{3}$/.test(c)) {
                c = '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
              }
              if (/^#[0-9A-Fa-f]{6}$/.test(c)) primary = c;
            }
            if (d && typeof d.themeMode === 'string') themeMode = d.themeMode;
          }
        } catch (e) {}
        var root = document.documentElement;
        root.style.setProperty('--app-boot-primary', primary);
        var dark =
          themeMode === 'dark' ||
          (themeMode === 'auto' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-boot-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      /*
       * 设计哲学（参考 saiadmin-vue 配色克制商务风）：
       * - 背景：单色 Arco bg-2 (#f7f8fa)，不用渐变、不堆色块
       * - 装饰：删除气泡 / 光晕 / 多色渐变；只保留 logo + 文字 + 三点 loader
       * - 主色：仅在 logo、品牌色块、loader 圆点上"点一下"，不大面积铺
       * - 灰阶：text-1 #1d2129 / text-2 #4e5969 / text-3 #86909c / text-4 #c9cdd4
       */
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
        color: #4e5969;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          sans-serif;
        z-index: 9999;
      }
      html[data-boot-theme='dark'] #app-loading {
        background: #17171a;
        color: #c9cdd4;
      }

      /* LOGO 卡片：纯白 + 轻阴影，圆角克制（4px），与 Arco 商务风一致 */
      .ml-card {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #ffffff;
        box-shadow:
          0 4px 16px rgba(29, 33, 41, 0.06),
          0 1px 3px rgba(29, 33, 41, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      html[data-boot-theme='dark'] .ml-card {
        background: #232324;
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.36),
          0 1px 3px rgba(0, 0, 0, 0.24);
      }
      .ml-card svg {
        width: 36px;
        height: 36px;
        display: block;
      }

      /* 品牌文字：纯文字，仅 Admin 用主色作单点强调，不渐变 */
      .ml-brand {
        margin-top: 22px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: #1d2129;
      }
      html[data-boot-theme='dark'] .ml-brand {
        color: #f7f8fa;
      }
      .ml-brand-accent {
        color: var(--app-boot-primary, #2c7be5);
      }

      /* 副标题：纯灰，无渐变无装饰 */
      .ml-tip {
        margin-top: 8px;
        font-size: 12px;
        letter-spacing: 1px;
        color: #86909c;
      }
      html[data-boot-theme='dark'] .ml-tip {
        color: #6b7785;
      }

      /* 三点 loader：单一主色，靠透明度区分而非多色 */
      .ml-dots {
        margin-top: 20px;
        display: flex;
        gap: 6px;
      }
      .ml-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--app-boot-primary, #2c7be5);
        animation: dotPulse 1.2s ease-in-out infinite;
      }
      .ml-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .ml-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes dotPulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* 版权：底部纯灰 */
      .ml-copy {
        position: absolute;
        bottom: 20px;
        font-size: 11px;
        color: #c9cdd4;
        letter-spacing: 0.5px;
      }
      html[data-boot-theme='dark'] .ml-copy {
        color: #4e5969;
      }
    </style>
