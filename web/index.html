<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=fun-inset-a-1" />
    <link rel="alternate icon" href="/favicon.ico?v=fun-inset-a-1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=fun-inset-a-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin Console" />
    <title>FunAdmin</title>
    <!-- Read persisted theme before the app mounts. -->
    <script>
      (function () {
        var KEY = 'ADMIN_THEME';
        var primary = '#5D87FF';
        var themeMode = 'light';
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var d = JSON.parse(raw);
            if (d && typeof d.primaryColor === 'string') {
              var c = d.primaryColor.trim();
              if (/^#[0-9A-Fa-f]{3}$/.test(c)) {
                c = '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
              }
              if (/^#[0-9A-Fa-f]{6}$/.test(c)) {
                // 与 app.migrateLegacyPrimary 一致：旧默认色迁移到所在预设的主色，避免启动时闪一下旧蓝。
                var legacy = [0x2c7be5, 0x165dff, 0x8b5cf6, 0x6366f1, 0xa78bfa];
                var value = parseInt(c.slice(1), 16);
                var preset = d.preset || 'elegant';
                var presetPrimary = { elegant: '#5D87FF', vibrant: '#2f80ed' }[preset] || '#5D87FF';
                var stale = legacy.indexOf(value) >= 0 || (preset === 'elegant' && value === 0x1677ff);
                primary = stale ? presetPrimary : c;
              }
            }
            if (d && typeof d.themeMode === 'string') themeMode = d.themeMode;
          }
        } catch (e) {}
        var root = document.documentElement;
        root.style.setProperty('--app-boot-primary', primary);
        var dark =
          themeMode === 'dark' ||
          (themeMode === 'auto' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-boot-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      /*
       * 设计哲学（参考 saiadmin-vue 配色克制商务风）：
       * - 背景：单色 Arco bg-2 (#f7f8fa)，不用渐变、不堆色块
       * - 装饰：删除气泡 / 光晕 / 多色渐变；只保留 logo + 文字 + 三点 loader
       * - 主色：仅在 logo、品牌色块、loader 圆点上"点一下"，不大面积铺
       * - 灰阶：text-1 #1d2129 / text-2 #4e5969 / text-3 #86909c / text-4 #c9cdd4
       */
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fafbfc;
        color: #4d5875;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          sans-serif;
        z-index: 9999;
      }
      html[data-boot-theme='dark'] #app-loading {
        background: #070707;
        color: #c9cdd4;
      }

      /* LOGO 卡片：纯白 + 轻阴影，圆角克制（4px），与 Arco 商务风一致 */
      .ml-card {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #ffffff;
        box-shadow:
          0 4px 16px rgba(29, 33, 41, 0.06),
          0 1px 3px rgba(29, 33, 41, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      html[data-boot-theme='dark'] .ml-card {
        background: #161618;
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.36),
          0 1px 3px rgba(0, 0, 0, 0.24);
      }
      .ml-card svg {
        width: 40px;
        height: 40px;
        display: block;
      }

      /* 品牌文字沿用 FunAdmin 字标，Admin 使用主题色。 */
      .ml-brand {
        margin-top: 22px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: #1d2129;
      }
      html[data-boot-theme='dark'] .ml-brand {
        color: #f7f8fa;
      }
      .ml-brand-accent {
        color: var(--app-boot-primary, #5D87FF);
      }

      /* 副标题：纯灰，无渐变无装饰 */
      .ml-tip {
        margin-top: 8px;
        font-size: 12px;
        letter-spacing: 1px;
        color: #86909c;
      }
      html[data-boot-theme='dark'] .ml-tip {
        color: #6b7785;
      }

      /* 三点 loader：单一主色，靠透明度区分而非多色 */
      .ml-dots {
        margin-top: 20px;
        display: flex;
        gap: 6px;
      }
      .ml-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--app-boot-primary, #5D87FF);
        animation: dotPulse 1.2s ease-in-out infinite;
      }
      .ml-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .ml-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes dotPulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* 版权：底部纯灰 */
      .ml-copy {
        position: absolute;
        bottom: 20px;
        font-size: 11px;
        color: #c9cdd4;
        letter-spacing: 0.5px;
      }
      html[data-boot-theme='dark'] .ml-copy {
        color: #4e5969;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="ml-card">
          <!-- 与共享 LogoMark 保持同形，首屏沿用持久化主题色。 -->
          <svg viewBox="0 0 64 64" width="40" height="40" xmlns="http://www.w3.org/2000/svg" fill="none" style="color: var(--app-boot-primary, #5D87FF)" aria-hidden="true"><rect width="64" height="64" rx="16" fill="currentColor" /><path d="M15 17H35.625L32.25 23.75H20.25V44Q20.25 45.5 18.75 45.5H13.5V18.5Q13.5 17 15 17Z" fill="#FFFFFF" /><path d="M38.0625 17H44.8125L41.4375 23.75H34.6875Z" fill="#FFFFFF" opacity=".78" /><path d="M24.5 28H28.8V39.7Q28.8 41.2 30.3 41.2H31.9V28H36.2V45.5H28L24.5 38.5Z" fill="#FFFFFF" /><path d="M40 28H48L51.3 34.6V45.5H47V33.8Q47 32.3 45.5 32.3H43.6V45.5H39.3V28.7Q39.3 28 40 28Z" fill="#FFFFFF" /></svg>
        </div>

        <div class="ml-brand">Fun<span class="ml-brand-accent">Admin</span></div>
        <div class="ml-tip">正在加载工作台</div>
        <div class="ml-dots"><span></span><span></span><span></span></div>
        <div class="ml-copy">Vue 3.5 · Element Plus · TypeScript</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
