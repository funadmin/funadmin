services:
  api:
    build:
      context: .
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.5-cli}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
    image: funadmin-webman-php:8.5
    working_dir: /app
    volumes:
      - .:/app
      - ../database:/core-database:ro
    environment:
      CORE_DATABASE_PATH: /core-database
      APP_DEBUG: ${APP_DEBUG:-false}
      WEBMAN_LISTEN: http://0.0.0.0:8787
      WEBMAN_WORKERS: ${WEBMAN_WORKERS:-2}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${WEBMAN_DB_HOST:-mc-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-${DB_NAME:-funadmin_git}}
      DB_USERNAME: ${DB_USERNAME:-${DB_USER:-root}}
      DB_PASSWORD: ${DB_PASSWORD:-${DB_PASS:?请配置现有数据库密码}}
      DB_PREFIX: ${DB_PREFIX-fun_}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-7200}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_QUEUE_ENABLED: ${AI_QUEUE_ENABLED:-false}
      AI_QUEUE_WORKERS: ${AI_QUEUE_WORKERS:-1}
      AI_QUEUE_REDIS_URL: ${AI_QUEUE_REDIS_URL:-redis://127.0.0.1:6379}
      AI_QUEUE_REDIS_PASSWORD: ${AI_QUEUE_REDIS_PASSWORD:-}
      AI_QUEUE_REDIS_DATABASE: ${AI_QUEUE_REDIS_DATABASE:-0}
      AI_QUEUE_REDIS_PREFIX: ${AI_QUEUE_REDIS_PREFIX:-funadmin-ai:}
      AI_SANDBOX_IMAGE: ${AI_SANDBOX_IMAGE:-}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
    networks:
      - existing-database
    ports:
      - "127.0.0.1:8787:8787"
networks:
  existing-database:
    external: true
    name: ${WEBMAN_DB_NETWORK:-mincode-test-dbs_default}
