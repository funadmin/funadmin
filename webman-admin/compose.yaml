services:
  api:
    build:
      context: .
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.5-cli}
    image: funadmin-webman-php:8.5
    working_dir: /app
    volumes:
      - .:/app
    environment:
      APP_DEBUG: ${APP_DEBUG:-false}
      WEBMAN_LISTEN: http://0.0.0.0:8787
      WEBMAN_WORKERS: ${WEBMAN_WORKERS:-2}
      DB_CONNECTION: mysql
      DB_HOST: ${WEBMAN_DB_HOST:-mc-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-${DB_NAME:-funadmin_git}}
      DB_USERNAME: ${DB_USERNAME:-${DB_USER:-root}}
      DB_PASSWORD: ${DB_PASSWORD:-${DB_PASS:?请配置现有数据库密码}}
      DB_PREFIX: ${DB_PREFIX-fun_}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-7200}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - existing-database
    ports:
      - "127.0.0.1:8787:8787"
networks:
  existing-database:
    external: true
    name: ${WEBMAN_DB_NETWORK:-mincode-test-dbs_default}
